{% assign description = page.description | default: site.description | strip_html | strip_newlines %}
<title>{{ site.title | escape }} - Homepage</title>
<meta name="description" content="{{ description | escape }}">
<meta name="author" content="{{ site.author.name | escape }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:type" content="website">
<meta property="og:locale" content="en_US">
<meta property="og:site_name" content="{{ site.title | escape }}">
<meta property="og:title" content="{{ site.title | escape }}">
<meta property="og:description" content="{{ description | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
{% assign social_image = site.static_files | where: 'path', '/images/social-preview.png' | first %}
{% if social_image %}
<meta property="og:image" content="{{ '/images/social-preview.png' | absolute_url }}">
<meta property="og:image:alt" content="Haoyang Li — personal homepage">
<meta name="twitter:card" content="summary_large_image">
{% else %}
<meta name="twitter:card" content="summary">
{% endif %}
